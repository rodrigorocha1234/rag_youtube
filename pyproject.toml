[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-comentarios-youtube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2",
  "httpx>=0.28,<1", "pandas>=2.2,<4", "prometheus-client>=0.21,<1",
  "langchain-core>=1,<2", "langchain-huggingface>=1,<2",
  "langchain-postgres>=0.0.16,<1", "mlflow>=3,<4",
]

[project.optional-dependencies]
modelos = ["sentence-transformers>=3,<6", "transformers>=4.45,<6", "torch>=2,<3"]
qa = ["pytest>=8,<10", "mypy>=1.15,<2", "ruff>=0.11,<1", "types-PyYAML>=6", "pandas-stubs>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
python_files = ["teste_*.py", "test_*.py"]
markers = ["externo: requer serviços reais e configuração completa"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
