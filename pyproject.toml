[project]
name = "youtube-comments-rag"
version = "0.1.0"
description = "RAG de comentários do YouTube com LangChain, Hugging Face, pgvector e MLflow GenAI"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "google-api-python-client>=2.0",
  "httpx>=0.27",
  "langchain>=0.3",
  "langchain-postgres>=0.0.12",
  "langchain-huggingface>=0.1",
  "mlflow>=3.0",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"
