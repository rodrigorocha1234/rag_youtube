projeto:
  nome: rag_comentarios_youtube
  arquivo_ambiente: .env
youtube:
  arquivo_ambiente: youtube.env
  segredo_ambiente: YOUTUBE_API_KEY
  ids_canais:
  - UCoLf24olVUtKOsSXlqv_-ag
  dias_publicacao_atras: 2
  modo_janela_publicacao: dia_exato
  timezone: America/Sao_Paulo
  incluir_respostas: true
  max_resultados_pagina: 100
  url_api: https://www.googleapis.com/youtube/v3
  timeout_segundos: 30
  tentativas_requisicao: 3
  espera_retry_segundos: 1
  quota_maxima: 10000
  custo_requisicao: 1
  status_retry:
  - 429
  - 500
  - 502
  - 503
  - 504
  limites_paginas:
    channels: 50
    playlistItems: 50
    commentThreads: 100
    comments: 100
datalake:
  camada_bronze: bronze
  camada_prata: prata
  camada_ouro: ouro
  diretorio_raiz: data_lake
rag:
  estrategia_recuperacao: hibrida
  recuperar_documentos: 8
  reranking_habilitado: true
  peso_semantico: 0.7
  peso_lexical: 0.3
  constante_rrf: 60
mlflow:
  habilitado: true
  uri_rastreamento: http://localhost:${MLFLOW_PORT}
  experimento: rag_comentarios_youtube
observabilidade:
  habilitada: true
  namespace_metricas: rag_youtube
  nivel_log: INFO
  buckets_latencia:
  - 0.1
  - 0.5
  - 1
  - 5
  - 10
  - 30
  - 60
  arquivo_metricas: production_artifacts/metricas_pipeline.prom
vetor:
  conexao_ambiente: POSTGRES_CONNECTION_STRING
  tabela: comentarios_youtube
  esquema: public
  inicializar_tabela: true
  usuario_ambiente: POSTGRES_USER
  senha_ambiente: POSTGRES_PASSWORD
  banco_ambiente: POSTGRES_DB
  porta_ambiente: PGPORT
  host: localhost
  driver: postgresql+psycopg
